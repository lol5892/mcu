name: Deploy Our Marvel to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Keep the working v1 build at the existing URL; add a separate test area.
      - uses: actions/checkout@v4
        with:
          ref: 8f62eb6
          path: family-preview-source
      - name: Configure isolated family preview
        run: cat .github/family-preview.env >> "$GITHUB_ENV"
      - name: Build family preview
        working-directory: family-preview-source
        env:
          BASE_PATH: /mcu/preview/
        run: |
          npm ci
          npm test
          npm run build
      - name: Add preview without changing production files
        run: cp -R family-preview-source/dist dist/preview
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
