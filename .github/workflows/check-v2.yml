name: Verify family universe
on:
  pull_request:
  push:
    branches: [feat/family-universe-2, release/2.5.4, release/2.5.5]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        id: browsers
      - run: npm run test:e2e
        if: always() && steps.browsers.outcome == 'success'
        env:
          CI: true
          PLAYWRIGHT_USE_BUNDLED: '1'
      - run: npm run test:pwa
        if: always() && steps.browsers.outcome == 'success'
        env:
          PLAYWRIGHT_USE_BUNDLED: '1'
      - run: npx playwright test -c playwright.family.config.ts
        if: always() && steps.browsers.outcome == 'success'
        env:
          PLAYWRIGHT_USE_BUNDLED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: family-254-results, path: 'test-results*' }
  sql-authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker run -d --name our-marvel-sql-test -e POSTGRES_PASSWORD=local-integration-only postgres:17-alpine
      - run: for attempt in {1..30}; do docker exec our-marvel-sql-test pg_isready -U postgres && exit 0; sleep 1; done; exit 1
      - run: ./scripts/test-sql.sh
  edge-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/media-upload/index.ts supabase/functions/push-dispatch/index.ts
      - run: deno test --config supabase/functions/deno.json supabase/functions/_shared/image_test.ts
  visual:
    strategy:
      fail-fast: false
      matrix:
        project: [iPhone-11-Pro-Max-Chromium, iPhone-16-Pro-Chromium, iPhone-11-Pro-Max-WebKit, iPhone-16-Pro-WebKit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test -c playwright.visual.config.ts --project="${{ matrix.project }}"
        env:
          PLAYWRIGHT_USE_BUNDLED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-polish-screenshots-${{ matrix.project }}
          path: |
            docs/v2.2/after
            docs/v2.5/after
            docs/v2.5/performance
            docs/v2.5.1/after
            docs/v2.5.2/after
            docs/v2.5.4/after
            docs/v2.5.3/after
            test-results-visual
